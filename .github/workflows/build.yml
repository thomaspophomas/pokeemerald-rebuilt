name: CI/CD

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Documentation structure
        run: sh scripts/ci/check_docs.sh

      - name: Architecture guard
        run: sh scripts/ci/architecture_guard.sh

      - name: Multiplayer fuzz checks
        run: python3 scripts/ci/multiplayer_fuzz.py

      - name: Multiplayer host simulator
        run: python3 scripts/ci/multiplayer_host_sim.py

      - name: Multiplayer net manifest
        run: python3 scripts/ci/check_net_manifest.py

      - name: Mod generator smoke
        run: python3 scripts/ci/modgen_smoke.py

      - name: Whitespace check
        run: git diff-tree --check -r --no-commit-id HEAD

  build-compare:
    runs-on: ubuntu-latest
    needs: docs-and-architecture
    permissions:
      contents: write
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout syms
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          path: symbols
          ref: symbols

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: Compare
        run: make -j${nproc} all syms

      - name: Move symfiles
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          cp -v *.sym symbols/
          echo "SYMBOLS_COMMIT_MSG=$(git log --format=%s -n 1 ${GITHUB_SHA})" >> $GITHUB_ENV

      - name: Update symfiles
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        working-directory: symbols
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.sym
          if ! git diff --cached --quiet; then
            git commit -m "${SYMBOLS_COMMIT_MSG}"
            git push
          fi

  build-modern:
    runs-on: ubuntu-latest
    needs: docs-and-architecture
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature_multiplayer: 0
            emulator_transport: 0
          - feature_multiplayer: 1
            emulator_transport: 0
          - feature_multiplayer: 1
            emulator_transport: 1
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 1
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Modern build
        run: make -j${nproc} all FEATURE_MULTIPLAYER=${{ matrix.feature_multiplayer }} FEATURE_MULTIPLAYER_EMULATOR_TRANSPORT=${{ matrix.emulator_transport }}

  build-feature-agbcc:
    runs-on: ubuntu-latest
    needs: docs-and-architecture
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      MODERN: 0
      COMPARE: 0
      FEATURE_MULTIPLAYER: 1
      FEATURE_MULTIPLAYER_EMULATOR_TRANSPORT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: agbcc

      - name: Feature build
        run: make -j${nproc} all

  release:
    runs-on: ubuntu-latest
    needs:
      - build-compare
      - build-modern
      - build-feature-agbcc
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source-only release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Source-only release. Built ROM artifacts are intentionally not uploaded by CI/CD.
